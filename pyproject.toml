[project]
name = "emiglio-robot"
version = "0.1.0"
description = "AI-powered Emiglio toy robot: voice, vision, and movement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gpiozero>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "opencv-python-headless>=4.10",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "anthropic>=0.40",
]

[project.scripts]
emiglio = "emiglio.__main__:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emiglio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
