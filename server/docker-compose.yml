services:
  stt:
    build: ./stt
    ports:
      - "8001:8001"
    restart: unless-stopped

  tts:
    build: ./tts
    ports:
      - "8002:8002"
    restart: unless-stopped

  brain:
    build: ./brain
    ports:
      - "8003:8003"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
