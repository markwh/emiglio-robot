# Emiglio requirements manifest
# Tracks milestones, requirements, and the v2.0+ idea parking lot.
# Managed by: emiglio-pm req <command>

milestones:
  v1.0:
    description: Working robot — moves, sees, hears, speaks, converses (wall-powered,
      flat floors, joystick-driven)
    deadline: null
    acceptance:
    - Plug in wall adapter, SSH into Pi
    - Run emiglio (or systemd auto-starts it), open web UI on phone
    - Drive robot around the room with joystick
    - Voice conversation (push-to-talk → STT → Brain → TTS → speaker)
    - Ask "what do you see?" and get camera-aware response
    - Emiglio personality present (retro-optimist, warm, 1-3 sentences)
  v2.0:
    description: Untethered + expanded capabilities (battery, projector, autonomy)
    deadline: null
